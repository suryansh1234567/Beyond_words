<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Sign Language Helper - Learn</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Fingerpose -->
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.1.0/dist/fingerpose.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <ion-icon name="hand-right-outline"></ion-icon>
                <span>Beyond<span class="pro-badge">Words</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><ion-icon name="videocam-outline"></ion-icon> Live Translation</a></li>
                <li class="active"><a href="learn.html"><ion-icon name="game-controller-outline"></ion-icon> Learning Mode</a></li>
            </ul>


        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header" style="flex-direction: column; align-items: stretch; margin-bottom: 1rem;">
                <!-- Duolingo-style Progress Bar -->
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="lesson-progress" style="width: 0%;"></div>
                    </div>
                    <span id="lesson-text">0 / 5</span>
                </div>
            </header>

            <div class="dashboard-grid" style="grid-template-columns: 1fr;">
                <!-- AI Camera & Challenge UI -->
                <div class="camera-card glass-panel" style="max-width: 800px; margin: 0 auto; width: 100%;">
                    
                    <div class="challenge-header" style="text-align: center; padding: 1.5rem;">
                        <h2 style="font-size: 1.2rem; color: #a1a1aa; font-weight: 500;">Current Challenge</h2>
                        <h1 id="challenge-word" style="font-size: 3rem; color: var(--primary); margin-top: 0.5rem; font-weight: 800; letter-spacing: 2px;">HELLO</h1>
                        <p id="challenge-hint" style="color: var(--text-light); font-size: 0.95rem; margin-top: 1rem; background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 8px; display: inline-block;">Hint goes here</p>
                    </div>
                    
                    <div class="video-container" style="position: relative;">
                        <video class="input_video" style="display:none;" autoplay playsinline></video>
                        <canvas class="output_canvas" width="640" height="480"></canvas>
                        
                        <div class="overlay-text" id="gesture-output" style="bottom: 20px;">
                            Waiting for Hand...
                        </div>
                        
                        <!-- Success Animation Overlay -->
                        <div id="success-overlay" class="success-overlay">
                            <ion-icon name="checkmark-circle"></ion-icon>
                            <h2>Excellent!</h2>
                        </div>
                    </div>
                    
                    <div class="confidence-section" style="padding: 1.5rem;">
                        <div class="stat-row">
                            <span id="hold-text">Hold the sign...</span>
                            <span id="accuracy-text" class="confidence-pct">0%</span>
                        </div>
                        <div class="accuracy-bar" style="height: 12px; border-radius: 6px;">
                            <div class="accuracy-fill" id="accuracy-fill" style="width: 0%; border-radius: 6px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Toast Notification -->
            <div id="toast-notification" class="toast-notification">
                <ion-icon name="alert-circle-outline"></ion-icon>
                <span>That took a while! Added to review queue.</span>
            </div>

            <!-- Lesson Complete Modal -->
            <div id="lesson-complete-modal" class="modal-backdrop">
                <div class="modal-card glass-panel" style="text-align: center; padding: 3rem;">
                    <ion-icon name="trophy" style="font-size: 5rem; color: #fbbf24; margin-bottom: 1rem;"></ion-icon>
                    <h2 style="font-size: 2rem; margin-bottom: 1rem;">Lesson Complete!</h2>
                    
                    <div class="analytics-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 12px; text-align: left;">
                        <div class="stat-item" style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Total Time</span>
                            <strong id="stat-total-time" style="font-size: 1.2rem; color: var(--primary-light);">0s</strong>
                        </div>
                        <div class="stat-item" style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Avg. Time / Sign</span>
                            <strong id="stat-avg-time" style="font-size: 1.2rem; color: var(--accent-cyan);">0s</strong>
                        </div>
                        <div class="stat-item" style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Struggle Words</span>
                            <strong id="stat-struggles" style="font-size: 1.2rem; color: var(--warning);">0</strong>
                        </div>
                        <div class="stat-item" style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Mastered First Try</span>
                            <strong id="stat-mastered" style="font-size: 1.2rem; color: var(--success);">0</strong>
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="location.reload()" style="font-size: 1.2rem; padding: 1rem 2rem;">Play Again</button>
                </div>
            </div>

        </main>
    </div>
    
    <script src="learn.js"></script>
</body>
</html>
